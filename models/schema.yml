version: 1

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: stg_orderdetails
    columns:
      - name: order_detail_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: dim_customer
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_product
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: fact_orders
    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: quantity
        data_tests:
          - not_null